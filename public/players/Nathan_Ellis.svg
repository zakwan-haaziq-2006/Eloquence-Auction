<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c0f" />
      <stop offset="50%" stop-color="#020a05" />
      <stop offset="100%" stop-color="#010503" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bgGrad)" />
  <rect width="196" height="196" x="2" y="2" rx="26" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" />
  <circle cx="100" cy="85" r="70" fill="url(#halo)" />

  <!-- Hexagon Badge Frame -->
  <polygon points="100,25 150,54 150,112 100,141 50,112 50,54" fill="rgba(255,255,255,0.03)" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Player Silhouette / Insignia -->
  <circle cx="100" cy="72" r="28" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="2" />
  
  <!-- Player Initials -->
  <text x="100" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    NE
  </text>

  <!-- Bottom Role Badge -->
  <rect x="35" y="148" width="130" height="28" rx="8" fill="rgba(2, 12, 6, 0.95)" stroke="#ef4444" stroke-width="1.5" />
  <text x="100" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#ef4444" text-anchor="middle" letter-spacing="2">
    BOWL • AUSTRALIA
  </text>
</svg>